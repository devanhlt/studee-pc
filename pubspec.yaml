name: studee_pc
description: Personal desktop study overlay assistant for Vietnamese learners.
publish_to: 'none'
version: 1.0.10+13

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  drift: ^2.26.0
  sqlite3_flutter_libs: ^0.5.32
  path_provider: ^2.1.6
  path: ^1.9.1
  uuid: ^4.5.1
  crypto: ^3.0.6
  http: ^1.3.0
  file_picker: ^11.0.3
  archive: ^4.0.4
  intl: ^0.20.2
  collection: ^1.19.1
  equatable: ^2.0.7
  meta: ^1.16.0
  window_manager: ^0.4.3
  desktop_multi_window: ^0.2.1
  hotkey_manager: ^0.2.3
  screen_retriever: ^0.2.2
  screen_capturer: ^0.2.3
  clipboard: ^0.1.3
  markdown_widget: ^2.3.2+6
  shared_preferences: ^2.5.3
  logging: ^1.3.0
  json_annotation: ^4.9.0
  gpt_markdown: ^1.2.1
  flutter_math_fork: ^0.7.4
  image_picker: ^1.2.3
  image_cropper: ^12.2.1
  camera: ^0.12.1
  image: ^4.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.26.0
  build_runner: ^2.4.15
  json_serializable: ^6.9.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/models/paddleocr-vl-1.6/
    - assets/prompts/
    - assets/fonts/BeVietnamPro-Regular.ttf
    - assets/fonts/BeVietnamPro-Bold.ttf
  fonts:
    - family: Be Vietnam Pro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
