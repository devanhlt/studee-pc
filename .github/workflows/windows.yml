name: Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: dart analyze lib --fatal-infos=false

      - name: Test
        run: flutter test

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package ZIP
        shell: pwsh
        run: |
          $env:SKIP_BUILD = '1'
          powershell -ExecutionPolicy Bypass -File .\scripts\package_windows.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Studee-windows
          path: dist/Studee-*-windows.zip
          if-no-files-found: error
